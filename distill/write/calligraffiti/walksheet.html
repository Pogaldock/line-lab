<!doctype html><canvas id="c"></canvas>
<script>
// the whole line (walk and tags) with one broad nib: pen edge of `nib` walk units at angle `ang`, scaled by the walk's pressure
window.draw = (runs, opt) => {
  const W = 1600, H = opt.H || 520, c = document.getElementById('c'); c.width = W; c.height = H * runs.length; const cx = c.getContext('2d');
  const bg = opt.theme === 'paper' ? '#efe8dc' : '#0e0f12', ink = opt.pink ? '#ff4fa3' : (opt.theme === 'paper' ? '#141416' : '#f0eade');
  cx.fillStyle = bg; cx.fillRect(0, 0, W, c.height);
  runs.forEach((r, k) => { const P = r.line, xs = P.map(p => p[0]), ys = P.map(p => p[1]);
    const s = Math.min((W - 80) / (Math.max(...xs) - Math.min(...xs)), (H - 70) / (Math.max(...ys) - Math.min(...ys))), ox = 40 - Math.min(...xs) * s, oy = k * H + 45 - Math.min(...ys) * s;
    const ang = opt.ang == null ? -0.75 : opt.ang, nib = (opt.nib || 0.55) * s, hx = Math.cos(ang) / 2, hy = Math.sin(ang) / 2;
    cx.fillStyle = ink; cx.strokeStyle = ink; cx.lineWidth = 1;
    for (let i = 1; i < P.length; i++) { const a = [ox + P[i - 1][0] * s, oy + P[i - 1][1] * s], b = [ox + P[i][0] * s, oy + P[i][1] * s], w = nib * (0.02 + 1.2 * Math.min(1, P[i][2] / 0.65));
      cx.beginPath(); cx.moveTo(a[0] + hx * w, a[1] + hy * w); cx.lineTo(b[0] + hx * w, b[1] + hy * w); cx.lineTo(b[0] - hx * w, b[1] - hy * w); cx.lineTo(a[0] - hx * w, a[1] - hy * w); cx.closePath(); cx.fill(); cx.stroke(); }
    cx.fillStyle = '#8a8d95'; cx.font = '18px monospace'; cx.fillText(r.label || '', 16, k * H + 26); });
  return c.toDataURL('image/png'); };
</script>
